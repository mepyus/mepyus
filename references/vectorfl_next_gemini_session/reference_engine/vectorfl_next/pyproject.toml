[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorfl-next"
version = "0.1.0"
description = "Formation-first adjacent space engine scaffold"
requires-python = ">=3.8"

[tool.setuptools]
packages = [
  "app",
  "app.core",
  "app.events",
  "app.models",
  "app.runtime",
]
